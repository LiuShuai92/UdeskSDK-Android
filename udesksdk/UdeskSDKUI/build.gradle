apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
//apply plugin: 'com.github.dcendents.android-maven'
group = 'com.github.udesk'

repositories {
    maven { url 'https://oss.jfrog.org/libs-snapshot' }
    maven { url 'https://jitpack.io' }
    mavenCentral()
    google()
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        namespace 'cn.udesk'
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            // 【关键点3】GroupId 和 ArtifactId
            groupId = 'com.github.LiuShuai92.UdeskSDK-Android'
            artifactId = 'UdeskSDKUI'
            version = '5.7.0'

            // 【关键点4】组件加载必须包在 afterEvaluate 里，否则有时候会报 "components not found"
            afterEvaluate {
                from components.release
            }
        }
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation group: 'org.ccil.cowan.tagsoup', name: 'tagsoup', version: '1.2.1'
    implementation files('libs/udesk-asmack-8-4.0.6.jar')
    api files('libs/udesk_sdk_5.4.3.jar')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
